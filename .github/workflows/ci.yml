name: CI

# Tests unitaires + seuil de couverture bloquant sur les services métier.
# Voir docs/strategie-tests.md pour le choix du seuil (70 % par service) et le périmètre.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests unitaires (services métier)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cache des téléchargements, invalidé dès que le lockfile change.
      - name: Resolve yarn cache dir
        id: yarn-cache
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-cache-${{ runner.os }}-node22-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-cache-${{ runner.os }}-node22-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      # turbo run test:ci ne cible que les workspaces qui déclarent le script test:ci.
      # Chaque service lance `jest --coverage --ci` : le job échoue si un test casse
      # OU si un service passe sous 70 % de couverture. Le seuil vient du
      # coverageThreshold du package.json du service : les services métier le
      # déclarent, log-service et ticket-service non — leurs tests sont dans la
      # barrière, sans seuil de couverture.
      - name: Run unit tests with coverage gate
        run: yarn test:ci
