name: CI

# Tests unitaires + seuil de couverture bloquant sur les services métier.
# Voir docs/strategie-tests.md pour le choix du seuil (70 % par service) et le périmètre.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests unitaires (services métier)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # yarn.lock n'est pas versionné (cf. .gitignore) : on ne peut utiliser ni
      # `cache: yarn` de setup-node (clé calculée sur le lockfile) ni
      # `--frozen-lockfile`. On met seulement en cache le dossier de tarballs de
      # yarn : `yarn install` reconstruit node_modules à chaque run, mais sans
      # aucun téléchargement réseau. Cache invalidé dès qu'un package.json change.
      - name: Resolve yarn cache dir
        id: yarn-cache
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-cache-${{ runner.os }}-node22-${{ hashFiles('**/package.json') }}
          restore-keys: |
            yarn-cache-${{ runner.os }}-node22-

      - name: Install dependencies
        run: yarn install --non-interactive

      # turbo run test:ci ne cible que les workspaces qui déclarent le script test:ci
      # (payment-service, order-service, cart-service). Chaque service lance
      # `jest --coverage --ci` : le job échoue si un test casse OU si un service
      # passe sous 70 % de couverture (coverageThreshold dans son package.json).
      - name: Run unit tests with coverage gate
        run: yarn test:ci
