name: Release

# Montée de version automatique (Option B) — le tag naît du fichier VERSION.
#
# Règle : une release ne sort QUE de `main`. Sur un push vers `main`, si le fichier VERSION
# désigne une version pas encore taguée, on crée le tag `vX.Y.Z` automatiquement, puis on
# build et on pousse les images du template sous ce tag (registry GHCR).
#
# => Le seul geste de release est de bumper VERSION dans la PR vers `main`.
#    Le tag et les images versionnées se créent tout seuls, et collent toujours au code de main.
#
# Consommation en prod : régler PLATFORM_VERSION=<version> et IMAGE_TAG=<version> sur
# l'orchestrateur (il lit déjà PLATFORM_VERSION en priorité) pour déployer/mettre à jour
# les tenants vers cette version.

on:
  push:
    branches: [main]

permissions:
  contents: write # créer et pousser le tag
  packages: write # pousser les images vers le registry GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  tag:
    name: Tag depuis VERSION
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      is_new: ${{ steps.check.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nécessaire pour voir tous les tags existants

      - id: read
        name: Lire la version
        run: |
          VERSION="$(tr -d ' \t\r\n' < VERSION)"
          if [ -z "$VERSION" ]; then
            echo "::error::Le fichier VERSION est vide."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version courante : $VERSION"

      - id: check
        name: Créer le tag s'il n'existe pas déjà
        run: |
          VERSION="${{ steps.read.outputs.version }}"
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG déjà présent : rien à publier."
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Tag $TAG créé et poussé."
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & push ${{ matrix.name }}
    needs: tag
    if: needs.tag.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: front, dockerfile: templates/front/Dockerfile }
          - { name: api-gateway, dockerfile: templates/back/api-gateway/Dockerfile }
          - { name: auth-service, dockerfile: templates/back/services/auth-service/Dockerfile }
          - { name: user-service, dockerfile: templates/back/services/user-service/Dockerfile }
          - { name: page-service, dockerfile: templates/back/services/page-service/Dockerfile }
          - { name: log-service, dockerfile: templates/back/services/log-service/Dockerfile }
          - { name: product-service, dockerfile: templates/back/services/product-service/Dockerfile }
          - { name: order-service, dockerfile: templates/back/services/order-service/Dockerfile }
          - { name: cart-service, dockerfile: templates/back/services/cart-service/Dockerfile }
          - { name: payment-service, dockerfile: templates/back/services/payment-service/Dockerfile }
          - { name: notifier-service, dockerfile: templates/back/services/notifier-service/Dockerfile }
          - { name: stock-service, dockerfile: templates/back/services/stock-service/Dockerfile }
          - { name: ticket-service, dockerfile: templates/back/services/ticket-service/Dockerfile }
          - { name: assistant-service, dockerfile: templates/back/services/assistant-service/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion au registry GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: img
        name: Nom d'image (minuscules)
        # Chemin aligné sur le compose tenant : ${IMAGE_PREFIX}/<service>. En prod on posera
        # IMAGE_PREFIX=ghcr.io/<owner>/goosee, donc l'image pull est <prefix>/<service>:<version>.
        run: |
          REPO="$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/goosee/${{ matrix.name }}" | tr '[:upper:]' '[:lower:]')"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.img.outputs.repo }}:${{ needs.tag.outputs.version }}
            ${{ steps.img.outputs.repo }}:latest
          # Le front bake ses variables NEXT_PUBLIC au build ; clé Stripe optionnelle via secret.
          build-args: |
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_DEMO_PAYMENT=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    name: Résumé
    needs: [tag, build]
    if: needs.tag.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Récapitulatif de la release
        run: |
          VERSION="${{ needs.tag.outputs.version }}"
          {
            echo "### Release $VERSION publiée ✅"
            echo ""
            echo "- Tag \`v$VERSION\` créé sur \`main\`."
            echo "- Images poussées sur \`${{ env.REGISTRY }}/${{ github.repository_owner }}/goosee/*:$VERSION\` (+ \`:latest\`)."
            echo "- En prod : \`IMAGE_PREFIX=${{ env.REGISTRY }}/${{ github.repository_owner }}/goosee\`."
            echo ""
            echo "**Déploiement** : sur l'orchestrateur, régler \`PLATFORM_VERSION=$VERSION\` et \`IMAGE_TAG=$VERSION\`,"
            echo "puis lancer la montée de version des sites (supervision, bannière client ou cron patch-auto)."
          } >> "$GITHUB_STEP_SUMMARY"
