services:
  goosee-api-gateway-prod:
    container_name: goosee-api-gateway-prod
    build:
      context: ../..
      dockerfile: templates/back/api-gateway/Dockerfile
    command: node dist/main
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT}
      AUTH_SERVICE_HOST: ${AUTH_SERVICE_HOST}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT}
      USER_SERVICE_HOST: ${USER_SERVICE_HOST}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT}
      PAGE_SERVICE_HOST: ${PAGE_SERVICE_HOST}
      PAGE_SERVICE_PORT: ${PAGE_SERVICE_PORT}
      LOG_SERVICE_HOST: ${LOG_SERVICE_HOST}
      LOG_SERVICE_PORT: ${LOG_SERVICE_PORT}
      PRODUCT_SERVICE_HOST: ${PRODUCT_SERVICE_HOST}
      PRODUCT_SERVICE_PORT: ${PRODUCT_SERVICE_PORT}
      ORDER_SERVICE_HOST: ${ORDER_SERVICE_HOST}
      ORDER_SERVICE_PORT: ${ORDER_SERVICE_PORT}
      CART_SERVICE_HOST: ${CART_SERVICE_HOST}
      CART_SERVICE_PORT: ${CART_SERVICE_PORT}
      PAYMENT_SERVICE_HOST: ${PAYMENT_SERVICE_HOST}
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT}
      STOCK_SERVICE_HOST: ${STOCK_SERVICE_HOST}
      STOCK_SERVICE_PORT: ${STOCK_SERVICE_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL}
    depends_on:
      - goosee-auth-service-prod
      - goosee-user-service-prod
      - goosee-page-service-prod
      - goosee-log-service-prod
      - goosee-product-service-prod
      - goosee-order-service-prod
      - goosee-cart-service-prod
      - goosee-payment-service-prod
    networks:
      - goosee_net

  # ─────────── AUTH ───────────
  goosee-auth-service-prod:
    container_name: goosee-auth-service-prod
    build:
      context: ../..
      dockerfile: templates/back/services/auth-service/Dockerfile
    command: node dist/main
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      RABBITMQ_URL: ${RABBITMQ_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT}
      AUTH_DB_HOST: ${AUTH_DB_HOST}
      AUTH_DB_PORT: ${AUTH_DB_PORT}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
    expose:
      - "${AUTH_SERVICE_PORT}"
    depends_on:
      goosee-auth-db-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${AUTH_SERVICE_PORT}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - goosee_net

  goosee-auth-db-prod:
    image: postgres:16-alpine
    container_name: goosee-auth-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    expose:
      - "${AUTH_DB_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - goosee_net

  # ─────────── USER ───────────
  goosee-user-service-prod:
