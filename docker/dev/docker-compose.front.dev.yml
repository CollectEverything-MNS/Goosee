services:
    goosee-front-dev:
        container_name: goosee-front-dev
        build:
            context: ../../templates/front
            dockerfile: Dockerfile.dev
        command: yarn dev
        ports:
            - "3000:3000"
        environment:
            NEXT_PUBLIC_API_GATEWAY_URL: ${NEXT_PUBLIC_API_GATEWAY_URL}
            NODE_ENV: ${NODE_ENV}
        networks:
            - goosee_net
