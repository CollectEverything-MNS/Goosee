services:
    goosee-front-dev:
        container_name: goosee-front-dev
        build:
            context: ../../templates/front
            dockerfile: Dockerfile.dev
        command: yarn dev
        ports:
            - "3000:3000"
        environment:
            NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
            NODE_ENV: ${NODE_ENV}
        networks:
            - goosee_net

networks:
  goosee_net:
    external: true
    name: goosee_net
