services:
  goosee-api-gateway-dev:
    container_name: goosee-api-gateway-dev
    build:
      context: ../..
      dockerfile: templates/back/api-gateway/Dockerfile.dev
    command: yarn dev
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      AUTH_SERVICE_HOST: ${AUTH_SERVICE_HOST}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT}
    depends_on:
      - goosee-auth-service-dev
    networks:
      - goosee_net

  goosee-auth-service-dev:
    container_name: goosee-auth-service-dev
    build:
      context: ../..
      dockerfile: templates/back/services/auth-service/Dockerfile.dev
    command: yarn dev
    environment:
      NODE_ENV: ${NODE_ENV}
      RABBITMQ_URL: ${RABBITMQ_URL}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT}
      AUTH_DB_HOST: ${AUTH_DB_HOST}
      AUTH_DB_PORT: ${AUTH_DB_PORT}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
    expose:
      - "${AUTH_SERVICE_PORT}"
    depends_on:
      goosee-auth-db-dev:
        condition: service_healthy
      goosee-rabbitmq-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${AUTH_SERVICE_PORT}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - goosee_net

  goosee-auth-db-dev:
    image: postgres:16-alpine
    container_name: goosee-auth-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    expose:
      - "${AUTH_DB_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - goosee_net

  goosee-notifier-service-dev:
    container_name: goosee-notifier-service-dev
    build:
      context: ../..
      dockerfile: templates/back/services/notifier-service/Dockerfile.dev
    command: yarn dev
    environment:
      NODE_ENV: ${NODE_ENV}
      RABBITMQ_URL: ${RABBITMQ_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      goosee-rabbitmq-dev:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - goosee_net

volumes:
  auth_db_data:

networks:
  goosee_net:
    name: goosee_net
    driver: bridge
