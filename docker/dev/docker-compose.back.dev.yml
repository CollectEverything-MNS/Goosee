services:
  goosee-api-gateway-dev:
    container_name: goosee-api-gateway-dev
    build:
      context: ../..
      dockerfile: templates/back/api-gateway/Dockerfile.dev
    command: yarn dev
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      AUTH_SERVICE_HOST: ${AUTH_SERVICE_HOST}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PAGE_SERVICE_HOST: ${PAGE_SERVICE_HOST}
      PAGE_SERVICE_PORT: ${PAGE_SERVICE_PORT}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT}
      USER_SERVICE_HOST: ${USER_SERVICE_HOST}
      LOG_SERVICE_HOST: ${LOG_SERVICE_HOST}
      LOG_SERVICE_PORT: ${LOG_SERVICE_PORT}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL}
    depends_on:
      - goosee-auth-service-dev
    networks:
      - goosee_net

  goosee-auth-service-dev:
    container_name: goosee-auth-service-dev
    build:
      context: ../..
      dockerfile: templates/back/services/auth-service/Dockerfile.dev
    command: yarn dev
    environment:
      NODE_ENV: ${NODE_ENV}
      RABBITMQ_URL: ${RABBITMQ_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      AUTH_DB_HOST: ${AUTH_DB_HOST}
      AUTH_DB_PORT: 5432
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
    expose:
      - "${AUTH_SERVICE_PORT}"
    depends_on:
      goosee-auth-db-dev:
        condition: service_healthy
      goosee-rabbitmq-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${AUTH_SERVICE_PORT}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - goosee_net

  goosee-page-service-dev:
    container_name: goosee-page-service-dev
    build:
      context: ../..
      dockerfile: templates/back/services/page-service/Dockerfile.dev
    command: yarn dev
    environment:
      NODE_ENV: ${NODE_ENV}
      RABBITMQ_URL: ${RABBITMQ_URL}
      PAGE_SERVICE_PORT: ${PAGE_SERVICE_PORT}
      PAGE_DB_HOST: ${PAGE_DB_HOST}
      PAGE_DB_PORT: 5432
      PAGE_DB_USER: ${PAGE_DB_USER}
      PAGE_DB_PASSWORD: ${PAGE_DB_PASSWORD}
      PAGE_DB_NAME: ${PAGE_DB_NAME}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
    expose:
      - "${PAGE_SERVICE_PORT}"
    depends_on:
      goosee-page-db-dev:
        condition: service_healthy
      goosee-rabbitmq-dev:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost ${PAGE_SERVICE_PORT}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - goosee_net

  goosee-notifier-service-dev:
    container_name: goosee-notifier-service-dev
    build:
      context: ../..
      dockerfile: templates/back/services/notifier-service/Dockerfile.dev
    command: yarn dev
    environment:
      NODE_ENV: ${NODE_ENV}
      RABBITMQ_URL: ${RABBITMQ_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      goosee-rabbitmq-dev:
        condition: service_healthy
      goosee-mailhog-dev:
        condition: service_started
    restart: unless-stopped
    networks:
      - goosee_net

  goosee-user-service-dev:
    container_name: goosee-user-service-dev
    build:
      context: ../..
      dockerfile: templates/back/services/user-service/Dockerfile.dev
    command: yarn dev
    environment:
      NODE_ENV: ${NODE_ENV}
      RABBITMQ_URL: ${RABBITMQ_URL}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT}
      USER_DB_HOST: ${USER_DB_HOST}
      USER_DB_PORT: 5432
      USER_DB_USER: ${USER_DB_USER}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      USER_DB_NAME: ${USER_DB_NAME}
    expose:
      - "${USER_SERVICE_PORT}"
    depends_on:
      goosee-user-db-dev:
        condition: service_healthy
      goosee-rabbitmq-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${USER_SERVICE_PORT}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - goosee_net

  goosee-log-service-dev:
    container_name: goosee-log-service-dev
    build:
      context: ../..
      dockerfile: templates/back/services/log-service/Dockerfile.dev
    command: yarn dev
    environment:
      NODE_ENV: ${NODE_ENV}
      RABBITMQ_URL: ${RABBITMQ_URL}
      LOG_SERVICE_PORT: ${LOG_SERVICE_PORT}
      LOG_DB_HOST: ${LOG_DB_HOST}
      LOG_DB_PORT: 5432
      LOG_DB_USER: ${LOG_DB_USER}
      LOG_DB_PASSWORD: ${LOG_DB_PASSWORD}
      LOG_DB_NAME: ${LOG_DB_NAME}
    expose:
      - "${LOG_SERVICE_PORT}"
    depends_on:
      goosee-log-db-dev:
        condition: service_healthy
      goosee-rabbitmq-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${LOG_SERVICE_PORT}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - goosee_net

networks:
  goosee_net:
    name: goosee_net
    driver: bridge
