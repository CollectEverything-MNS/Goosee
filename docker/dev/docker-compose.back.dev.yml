services:
  goosee-api-gateway-dev:
    container_name: goosee-api-gateway-dev
    build:
      context: ../../templates/back/api-gateway
      dockerfile: Dockerfile.dev
    command: yarn dev
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    environment:
      AUTH_SERVICE_HOST: ${AUTH_SERVICE_HOST}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT}
      NODE_ENV: ${NODE_ENV}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT}
      USER_SERVICE_HOST: ${USER_SERVICE_HOST}
    depends_on:
      - goosee-auth-service-dev
    networks:
      - goosee_net

  goosee-auth-service-dev:
    container_name: goosee-auth-service-dev
    build:
      context: ../../templates/back/services/auth-service
      dockerfile: Dockerfile.dev
    command: yarn dev
    environment:
      NODE_ENV: ${NODE_ENV}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT}
      AUTH_DB_HOST: ${AUTH_DB_HOST}
      AUTH_DB_PORT: ${AUTH_DB_PORT}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
    expose:
      - "${AUTH_SERVICE_PORT}"
    depends_on:
      goosee-auth-db-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${AUTH_SERVICE_PORT}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - goosee_net

networks:
  goosee_net:
    driver: bridge
