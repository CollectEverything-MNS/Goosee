services:
  goosee-api-gateway-dev:
    container_name: goosee-api-gateway-dev
    build:
      context: ../../templates/back/api-gateway
      dockerfile: Dockerfile.dev
    command: yarn dev
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    environment:
      AUTH_SERVICE_HOST: ${AUTH_SERVICE_HOST}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT}
      PAGE_SERVICE_HOST: ${PAGE_SERVICE_HOST}
      PAGE_SERVICE_PORT: ${PAGE_SERVICE_PORT}
      NODE_ENV: ${NODE_ENV}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT}
      USER_SERVICE_HOST: ${USER_SERVICE_HOST}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL}
    depends_on:
      - goosee-auth-service-dev
      - goosee-page-service-dev
    networks:
      - goosee_net

  goosee-auth-service-dev:
    container_name: goosee-auth-service-dev
    build:
      context: ../../templates/back/services/auth-service
      dockerfile: Dockerfile.dev
    command: yarn dev
    environment:
      NODE_ENV: ${NODE_ENV}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT}
      AUTH_DB_HOST: ${AUTH_DB_HOST}
      AUTH_DB_PORT: ${AUTH_DB_PORT}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
    expose:
      - "${AUTH_SERVICE_PORT}"
    depends_on:
      goosee-auth-db-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${AUTH_SERVICE_PORT}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - goosee_net

  goosee-auth-db-dev:
    image: postgres:16-alpine
    container_name: goosee-auth-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    expose:
      - "${AUTH_DB_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - goosee_net

  goosee-notifier-service-dev:
    container_name: goosee-notifier-service-dev
    build:
      context: ../../templates/back/services/notifier-service
      dockerfile: Dockerfile.dev
    command: yarn dev
    environment:
      NODE_ENV: ${NODE_ENV}
      RABBITMQ_URL: ${RABBITMQ_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    restart: unless-stopped
    networks:
      - goosee_net

  goosee-page-service-dev:
    container_name: goosee-page-service-dev
    build:
      context: ../../templates/back/services/page-service
      dockerfile: Dockerfile.dev
    command: yarn dev
    environment:
      NODE_ENV: ${NODE_ENV}
      PAGE_SERVICE_PORT: ${PAGE_SERVICE_PORT}
      PAGE_DB_HOST: ${PAGE_DB_HOST}
      PAGE_DB_PORT: ${PAGE_DB_PORT}
      PAGE_DB_USER: ${PAGE_DB_USER}
      PAGE_DB_PASSWORD: ${PAGE_DB_PASSWORD}
      PAGE_DB_NAME: ${PAGE_DB_NAME}
    expose:
      - "${PAGE_SERVICE_PORT}"
    depends_on:
      goosee-page-db-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${PAGE_SERVICE_PORT}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - goosee_net

  goosee-page-db-dev:
    image: postgres:16-alpine
    container_name: goosee-page-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PAGE_DB_USER}
      POSTGRES_PASSWORD: ${PAGE_DB_PASSWORD}
      POSTGRES_DB: ${PAGE_DB_NAME}
    volumes:
      - page_db_data:/var/lib/postgresql/data
    expose:
      - "${PAGE_DB_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAGE_DB_USER} -d ${PAGE_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - goosee_net

volumes:
  auth_db_data:
  page_db_data:

networks:
  goosee_net:
    driver: bridge
