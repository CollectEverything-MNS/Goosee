services:
  rabbitmq:
    image: rabbitmq:management
    container_name: goosee-rabbitmq-dev
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"
    networks:
      - goosee_net

  goosee-adminer-service:
    container_name: goosee-adminer-service
    image: adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    networks:
      - goosee_net

networks:
  goosee_net:
    name: goosee_net
    driver: bridge
