services:
  rabbitmq:
    image: rabbitmq:management
    container_name: goosee-rabbitmq-dev
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"
    networks:
      - goosee_net

  goosee-auth-db-dev:
    image: postgres:16-alpine
    container_name: goosee-auth-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    expose:
      - "${AUTH_DB_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - goosee_net

volumes:
  auth_db_data:

networks:
  goosee_net:
    name: goosee_net
    driver: bridge
