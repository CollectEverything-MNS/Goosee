services:
  goosee-rabbitmq-dev:
    image: rabbitmq:management
    container_name: goosee-rabbitmq-dev
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - goosee_net

  goosee-adminer-dev:
    container_name: goosee-adminer-dev
    image: adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    networks:
      - goosee_net

networks:
  goosee_net:
    name: goosee_net
    driver: bridge
