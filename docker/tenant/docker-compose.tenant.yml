# Tenant POC : docker compose -p tenant-<slug> --env-file <env> -f <ce fichier> up -d
# Gemini facultatif : --profile assistant et GEMINI_API_KEY.
services:
  front:
    image: goosee/front:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      tenant_net: null
      goosee_platform:
        aliases:
          - ${TENANT_SLUG}-front
    cpus: '0.50'
  gateway:
    image: goosee/api-gateway:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: 3001
      AUTH_SERVICE_HOST: auth
      AUTH_SERVICE_PORT: 3003
      USER_SERVICE_HOST: user
      USER_SERVICE_PORT: 3002
      PAGE_SERVICE_HOST: page
      PAGE_SERVICE_PORT: 3004
      LOG_SERVICE_HOST: log
      LOG_SERVICE_PORT: 3005
      PRODUCT_SERVICE_HOST: product
      PRODUCT_SERVICE_PORT: 3006
      ORDER_SERVICE_HOST: order
      ORDER_SERVICE_PORT: 3007
      CART_SERVICE_HOST: cart
      CART_SERVICE_PORT: 3008
      PAYMENT_SERVICE_HOST: payment
      PAYMENT_SERVICE_PORT: 3009
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      NEXT_PUBLIC_WEB_URL: http://${TENANT_SLUG}.127.0.0.1.nip.io
      STOCK_SERVICE_HOST: stock
      STOCK_SERVICE_PORT: 3011
      TICKET_SERVICE_HOST: ticket
      TICKET_SERVICE_PORT: 3010
      ASSISTANT_SERVICE_HOST: assistant
      ASSISTANT_SERVICE_PORT: 3012
    depends_on:
      - auth
      - user
      - page
      - log
      - product
      - order
      - cart
      - payment
      - stock
      - ticket
    networks:
      tenant_net: null
      goosee_platform:
        aliases:
          - ${TENANT_SLUG}-gateway
    cpus: '0.50'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  auth:
    image: goosee/auth-service:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTH_SERVICE_PORT: 3003
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      AUTH_DB_HOST: auth-db
      AUTH_DB_PORT: 5432
      AUTH_DB_USER: postgres
      AUTH_DB_PASSWORD: ${DB_PASSWORD}
      AUTH_DB_NAME: auth_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      NEXT_PUBLIC_API_URL: http://api.${TENANT_SLUG}.127.0.0.1.nip.io
    depends_on:
      - auth-db
      - rabbitmq
    networks:
      - tenant_net
    cpus: '0.50'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  user:
    image: goosee/user-service:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      USER_SERVICE_PORT: 3002
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      USER_DB_HOST: user-db
      USER_DB_PORT: 5432
      USER_DB_USER: postgres
      USER_DB_PASSWORD: ${DB_PASSWORD}
      USER_DB_NAME: user_db
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on:
      - user-db
      - rabbitmq
    networks:
      - tenant_net
    cpus: '0.50'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  page:
    image: goosee/page-service:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PAGE_SERVICE_PORT: 3004
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PAGE_DB_HOST: page-db
      PAGE_DB_PORT: 5432
      PAGE_DB_USER: postgres
      PAGE_DB_PASSWORD: ${DB_PASSWORD}
      PAGE_DB_NAME: page_db
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: goosee-uploads
      MINIO_PUBLIC_URL: http://${TENANT_SLUG}.127.0.0.1.nip.io
    depends_on:
      - page-db
      - rabbitmq
      - minio
    networks:
      - tenant_net
    cpus: '0.50'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  log:
    image: goosee/log-service:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_SERVICE_PORT: 3005
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      LOG_DB_HOST: log-db
      LOG_DB_PORT: 5432
      LOG_DB_USER: postgres
      LOG_DB_PASSWORD: ${DB_PASSWORD}
      LOG_DB_NAME: log_db
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on:
      - log-db
      - rabbitmq
    networks:
      - tenant_net
    cpus: '0.50'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://localhost:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  product:
    image: goosee/product-service:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PRODUCT_SERVICE_PORT: 3006
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PRODUCT_DB_HOST: product-db
      PRODUCT_DB_PORT: 5432
      PRODUCT_DB_USER: postgres
      PRODUCT_DB_PASSWORD: ${DB_PASSWORD}
      PRODUCT_DB_NAME: product_db
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: goosee-uploads
      MINIO_PUBLIC_URL: http://${TENANT_SLUG}.127.0.0.1.nip.io
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on:
      - product-db
      - rabbitmq
      - minio
    networks:
      - tenant_net
    cpus: '0.50'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://localhost:3006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  order:
    image: goosee/order-service:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ORDER_SERVICE_PORT: 3007
      ORDER_DB_HOST: order-db
      ORDER_DB_PORT: 5432
      ORDER_DB_USER: postgres
      ORDER_DB_PASSWORD: ${DB_PASSWORD}
      ORDER_DB_NAME: order_db
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      STOCK_SERVICE_HOST: stock
      STOCK_SERVICE_PORT: 3011
      PRODUCT_SERVICE_HOST: product
      PRODUCT_SERVICE_PORT: 3006
    depends_on:
      - order-db
      - stock
      - rabbitmq
    networks:
      - tenant_net
    cpus: '0.50'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://localhost:3007/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  cart:
    image: goosee/cart-service:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CART_SERVICE_PORT: 3008
      CART_DB_HOST: cart-db
      CART_DB_PORT: 5432
      CART_DB_USER: postgres
      CART_DB_PASSWORD: ${DB_PASSWORD}
      CART_DB_NAME: cart_db
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on:
      - cart-db
    networks:
      - tenant_net
    cpus: '0.50'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://localhost:3008/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  payment:
    image: goosee/payment-service:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PAYMENT_SERVICE_PORT: 3009
      PAYMENT_DB_HOST: payment-db
      PAYMENT_DB_PORT: 5432
      PAYMENT_DB_USER: postgres
      PAYMENT_DB_PASSWORD: ${DB_PASSWORD}
      PAYMENT_DB_NAME: payment_db
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      ORDER_SERVICE_HOST: order
      ORDER_SERVICE_PORT: 3007
    depends_on:
      - payment-db
    networks:
      - tenant_net
    cpus: '0.50'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://localhost:3009/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  notifier:
    image: goosee/notifier-service:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      SMTP_FROM: no-reply@${TENANT_SLUG}.anaduck.fr
    depends_on:
      - rabbitmq
      - mailhog
    networks:
      - tenant_net
    cpus: '0.50'
  auth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: auth_db
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - tenant_net
    cpus: '0.50'
  user-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: user_db
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - tenant_net
    cpus: '0.50'
  page-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: page_db
    volumes:
      - page_db_data:/var/lib/postgresql/data
    networks:
      - tenant_net
    cpus: '0.50'
  log-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: log_db
    volumes:
      - log_db_data:/var/lib/postgresql/data
    networks:
      - tenant_net
    cpus: '0.50'
  product-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: product_db
    volumes:
      - product_db_data:/var/lib/postgresql/data
    networks:
      - tenant_net
    cpus: '0.50'
  order-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: order_db
    volumes:
      - order_db_data:/var/lib/postgresql/data
    networks:
      - tenant_net
    cpus: '0.50'
  cart-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: cart_db
    volumes:
      - cart_db_data:/var/lib/postgresql/data
    networks:
      - tenant_net
    cpus: '0.50'
  payment-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: payment_db
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    networks:
      - tenant_net
    cpus: '0.50'
  rabbitmq:
    image: rabbitmq:management
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - tenant_net
    cpus: '0.50'
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - tenant_net
    cpus: '0.50'
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    networks:
      - tenant_net
    cpus: '0.50'
  stock:
    image: goosee/stock-service:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      STOCK_SERVICE_PORT: 3011
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      STOCK_DB_HOST: stock-db
      STOCK_DB_PORT: 5432
      STOCK_DB_USER: postgres
      STOCK_DB_PASSWORD: ${DB_PASSWORD}
      STOCK_DB_NAME: stock_db
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on:
      - stock-db
      - rabbitmq
    networks:
      - tenant_net
    cpus: '0.50'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://localhost:3011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  stock-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: stock_db
    volumes:
      - stock_db_data:/var/lib/postgresql/data
    networks:
      - tenant_net
    cpus: '0.50'
  ticket:
    image: goosee/ticket-service:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TICKET_SERVICE_PORT: 3010
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      TICKET_DB_HOST: ticket-db
      TICKET_DB_PORT: 5432
      TICKET_DB_USER: postgres
      TICKET_DB_PASSWORD: ${DB_PASSWORD}
      TICKET_DB_NAME: ticket_db
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on:
      - ticket-db
      - rabbitmq
    networks:
      - tenant_net
    cpus: '0.50'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://localhost:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  ticket-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ticket_db
    volumes:
      - ticket_db_data:/var/lib/postgresql/data
    networks:
      - tenant_net
    cpus: '0.50'
  assistant:
    image: goosee/assistant-service:local
    profiles:
      - assistant
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ASSISTANT_SERVICE_PORT: 3012
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    networks:
      - tenant_net
    cpus: '0.50'
networks:
  tenant_net: null
  goosee_platform:
    external: true
volumes:
  auth_db_data: null
  user_db_data: null
  page_db_data: null
  log_db_data: null
  product_db_data: null
  order_db_data: null
  cart_db_data: null
  payment_db_data: null
  rabbitmq_data: null
  minio_data: null
  stock_db_data: null
  ticket_db_data: null
