<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site suspendu</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f6f8; color: #0f172a; padding: 24px; }
  .card { max-width: 460px; width: 100%; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px;
    padding: 40px 32px; text-align: center; box-shadow: 0 10px 30px rgba(15,23,42,.06); }
  .badge { width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 14px; display: flex; align-items: center;
    justify-content: center; background: #fee2e2; color: #dc2626; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { color: #64748b; font-size: 14px; line-height: 1.6; margin: 0; }
  .foot { margin-top: 24px; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.9" y1="4.9" x2="19.1" y2="19.1"/></svg>
    </div>
    <h1>Ce site est actuellement suspendu</h1>
    <p>L'accès à cette boutique a été temporairement bloqué par l'administration de la plateforme. Si vous en êtes le propriétaire, contactez le support pour rétablir votre site.</p>
    <div class="foot">Propulsé par Goosee</div>
  </div>
</body>
</html>
