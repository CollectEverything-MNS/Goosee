# Configuration Alertmanager de la plateforme Goosee.
#
# Notifications vers Discord : Discord accepte le format de payload Slack sur
# l'endpoint <webhook>/slack. On réutilise donc `slack_configs` d'Alertmanager.
# L'URL (avec le suffixe /slack) est lue depuis un fichier monté et non
# versionné : docker/observability/alertmanager/secrets/discord_webhook_url
# (cf. le .example à côté et le README).
global:
  resolve_timeout: 5m
  slack_api_url_file: /etc/alertmanager/secrets/discord_webhook_url

route:
  receiver: discord
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Les alertes critiques sont répétées plus souvent tant qu'elles sont actives.
    - matchers:
        - severity="critical"
      repeat_interval: 1h

receivers:
  - name: discord
    slack_configs:
      - channel: '#alertes'
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }} · {{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts -}}
          **Sévérité :** {{ .Labels.severity }}
          **Cible :** {{ .Labels.job }}{{ with .Labels.instance }} ({{ . }}){{ end }}
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  # Une cible down masque le bruit applicatif qu'elle génère sur le même job.
  - source_matchers: [alertname="TargetDown"]
    target_matchers: [severity="warning"]
    equal: ['job', 'instance']
