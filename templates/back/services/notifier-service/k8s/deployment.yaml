# Le notifier-service est un consumer RabbitMQ pur, il n'expose pas de port HTTP.
# Pas de Service K8s nécessaire.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier-service
  namespace: goosee-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifier-service
  template:
    metadata:
      labels:
        app: notifier-service
    spec:
      containers:
        - name: notifier-service
          image: dev-goosee-notifier-service-dev:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: goosee-config
            - secretRef:
                name: goosee-secrets
