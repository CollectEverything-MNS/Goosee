apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: goosee-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: dev-goosee-user-service-dev:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: goosee-config
            - secretRef:
                name: goosee-secrets
          readinessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12
