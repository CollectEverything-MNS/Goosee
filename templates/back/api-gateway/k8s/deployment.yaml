apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: goosee-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: dev-goosee-api-gateway-dev:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: goosee-config
            - secretRef:
                name: goosee-secrets
          readinessProbe:
            httpGet:
              path: /api-docs
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12
