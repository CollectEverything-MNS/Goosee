# Secrets du tenant. Toutes les bases partagent le même mot de passe (DB_PASSWORD),
# exposé sous chaque clé <SVC>_DB_PASSWORD pour que `envFrom` suffise côté services.
apiVersion: v1
kind: Secret
metadata:
  name: goosee-secrets
  labels:
    {{- include "goosee.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  AUTH_DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  USER_DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  PAGE_DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  LOG_DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  PRODUCT_DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  ORDER_DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  CART_DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  PAYMENT_DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}

  STOCK_DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  TICKET_DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}

  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  JWT_ACCESS_SECRET: {{ .Values.secrets.jwtAccessSecret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.jwtRefreshSecret | quote }}

  INTERNAL_API_TOKEN: {{ .Values.secrets.internalApiToken | quote }}

  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | quote }}

  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}

  # OWNER seedé au déploiement (hash bcrypt fourni par l'orchestrateur)
  OWNER_EMAIL: {{ .Values.owner.email | quote }}
  OWNER_PASSWORD_HASH: {{ .Values.owner.passwordHash | quote }}
  OWNER_FIRST_NAME: {{ .Values.owner.firstName | default "Admin" | quote }}
  OWNER_LAST_NAME: {{ .Values.owner.lastName | default "Goosee" | quote }}
