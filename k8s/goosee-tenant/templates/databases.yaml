# Une base PostgreSQL dédiée par service (StatefulSet + Service ClusterIP). Boucle sur
# .Values.databases : chaque base ne diffère que par son nom de Service et POSTGRES_DB.
{{- range .Values.databases }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    {{- include "goosee.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ .name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .name }}
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .name }}
  labels:
    {{- include "goosee.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ .name }}
spec:
  serviceName: {{ .name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        {{- include "goosee.labels" $ | nindent 8 }}
        app.kubernetes.io/name: {{ .name }}
    spec:
      containers:
        - name: postgres
          image: {{ $.Values.postgres.image }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: {{ .db }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: goosee-secrets
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', 'postgres', '-d', '{{ .db }}']
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.resources.db | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: {{ $.Values.postgres.storage }}
{{- end }}
