# Ingress du tenant : seules la gateway (API) et le front sont exposés hors du namespace.
#   <slug>.<domain>      -> front  (Next.js)
#   api.<slug>.<domain>  -> gateway (seule porte d'entrée HTTP des microservices)
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goosee
  labels:
    {{- include "goosee.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ include "goosee.host" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.front.name }}
                port:
                  number: {{ .Values.front.port }}
    - host: {{ include "goosee.apiHost" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.gateway.name }}
                port:
                  number: {{ .Values.gateway.port }}
{{- end }}
