# Valeurs par défaut du chart d'un tenant. L'orchestrateur surcharge `tenant.*` et
# `secrets.*` par tenant (secrets générés, jamais les valeurs par défaut interdites en prod).
tenant:
  slug: demo
  # host du site = <slug>.<domain> ; API = api.<slug>.<domain>
  domain: 127.0.0.1.nip.io

image:
  # Préfixe de registre optionnel (ex. registry k3d). Vide = images importées dans le cluster.
  registry: ''
  tag: local
  pullPolicy: IfNotPresent

# Ingress (Traefik fourni par k3s). Le site est servi sur <slug>.<domain> et l'API sur
# api.<slug>.<domain>. En local, ces hôtes nip.io résolvent vers 127.0.0.1 ; le port
# dépend du mapping du loadbalancer k3d (8081 par défaut dans le README).
ingress:
  enabled: true
  className: traefik

# Utilisateur OWNER seedé au déploiement (Job Helm). L'orchestrateur calcule le hash bcrypt
# (le mot de passe en clair ne rentre jamais dans le cluster) ; hash vide => pas de seed.
owner:
  email: admin@goosee.dev
  passwordHash: ''
  firstName: Admin
  lastName: Goosee

# Secrets du tenant (générés par l'orchestrateur ; valeurs de démo NON utilisables en prod).
secrets:
  dbPassword: changeme-db
  jwtSecret: changeme-jwt
  jwtAccessSecret: changeme-jwt-access
  jwtRefreshSecret: changeme-jwt-refresh
  internalApiToken: changeme-internal
  minioRootUser: gooseeminio
  minioRootPassword: changeme-minio
  stripeSecretKey: ''
  stripeWebhookSecret: ''
  geminiApiKey: ''

# Gateway HTTP (seule porte d'entrée API) et front Next.js.
# readyPath : la gateway n'a que /health ; les microservices ont /health/ready (check DB).
gateway:
  name: gateway
  image: goosee/api-gateway
  port: 3001
  readyPath: /health
front:
  name: front
  image: goosee/front
  port: 3000

# Ressources (requests/limits) et autoscaling. requests.cpu est requis pour l'HPA.
# Requests/limits dimensionnés pour tenir plusieurs tenants K8s sur un portable 16 Go
# (requests = ce qui est réservé au scheduling ; limits = plafond pour éviter l'OOM hôte).
resources:
  app:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { cpu: 400m, memory: 320Mi }
  db:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 400m, memory: 256Mi }
  infra:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { cpu: 400m, memory: 384Mi }

# Autoscaling horizontal (gateway + microservices + front), sur l'usage CPU.
# maxReplicas plafonné à 2 pour limiter l'empreinte mémoire sur un portable.
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUPercent: 80

# Isolation réseau : refuse l'ingress venant des autres tenants (namespaces), n'autorise
# que l'intra-namespace et le contrôleur d'ingress (Traefik dans kube-system).
networkPolicy:
  enabled: true

# Plafond de ressources du namespace du tenant (borne la consommation, requests + limits
# obligatoires sur chaque pod — d'où les resources sur tous les workloads et le Job de seed).
resourceQuota:
  enabled: true
  # Dimensionné pour le socle (~22 pods) + la marge d'autoscaling, version allégée 16 Go.
  requestsCpu: '3'
  requestsMemory: 3Gi
  limitsCpu: '16'
  limitsMemory: 12Gi
  pods: '60'

# Microservices HTTP internes (Deployment + Service ClusterIP). Chacun a sa base dédiée.
backendServices:
  - { name: auth, image: goosee/auth-service, port: 3003 }
  - { name: user, image: goosee/user-service, port: 3002 }
  - { name: page, image: goosee/page-service, port: 3004 }
  - { name: log, image: goosee/log-service, port: 3005 }
  - { name: product, image: goosee/product-service, port: 3006 }
  - { name: order, image: goosee/order-service, port: 3007 }
  - { name: cart, image: goosee/cart-service, port: 3008 }
  - { name: payment, image: goosee/payment-service, port: 3009 }
  - { name: stock, image: goosee/stock-service, port: 3011 }
  - { name: ticket, image: goosee/ticket-service, port: 3010 }

assistant:
  enabled: false
  model: gemini-2.5-flash
  # Modeles de repli essayes dans l'ordre si le principal est sature (503/429) ou en erreur.
  fallbackModels: gemini-2.5-flash,gemini-2.5-flash-lite

# Notifier : RMQ uniquement, pas de port HTTP ni de base.
notifier:
  name: notifier
  image: goosee/notifier-service

# Une base PostgreSQL dédiée par service (database-per-service).
databases:
  - { name: auth-db, db: auth_db }
  - { name: user-db, db: user_db }
  - { name: page-db, db: page_db }
  - { name: log-db, db: log_db }
  - { name: product-db, db: product_db }
  - { name: order-db, db: order_db }
  - { name: cart-db, db: cart_db }
  - { name: payment-db, db: payment_db }
  - { name: stock-db, db: stock_db }
  - { name: ticket-db, db: ticket_db }

postgres:
  image: postgres:16-alpine
  storage: 1Gi
rabbitmq:
  image: rabbitmq:management
  storage: 1Gi
minio:
  image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
  storage: 2Gi
  bucket: goosee-uploads
mailhog:
  image: mailhog/mailhog:v1.0.1
